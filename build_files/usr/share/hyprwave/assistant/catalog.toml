# Hyprwave Assistant — curated software catalog
# Easy to extend. Used by the Installer tab and `hyprwave-assistant install|list`.
# source = "flathub" → flatpak install -y flathub <flatpak>
# source = "layer"   → show manual layering notes (not auto-applied)
#
# Flatpak IDs below are well-known Flathub application IDs. Do not invent IDs.

[[category]]
name = "Office & Productivity"
items = [
  { id = "libreoffice", name = "LibreOffice", source = "flathub", flatpak = "org.libreoffice.LibreOffice", description = "Full office suite (Writer, Calc, Impress)" },
  { id = "onlyoffice", name = "OnlyOffice", source = "flathub", flatpak = "org.onlyoffice.desktopeditors", description = "Lightweight office alternative" },
  { id = "obsidian", name = "Obsidian", source = "flathub", flatpak = "md.obsidian.Obsidian", description = "Markdown knowledge base / notes" },
  { id = "joplin", name = "Joplin", source = "flathub", flatpak = "net.cozic.joplin_desktop", description = "Open-source notes with sync" },
  { id = "thunderbird", name = "Thunderbird", source = "flathub", flatpak = "org.mozilla.Thunderbird", description = "Email, calendar, and feeds" },
]

