# Arcade Rain — wet neon arcade night
# cool steel-blue darks, pink + cyan reflections, coin yellow sparks
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    layout = dwindle
    # wet neon: pink washes into cyan along the frame
    col.active_border = rgba(ff4d9eee) rgba(00e0ffee) 45deg
    col.inactive_border = rgba(1a2438aa)
}
decoration {
    rounding = 8
    active_opacity = 0.94
    blur {
        enabled = true
        size = 8
        passes = 3
    }
    shadow {
        enabled = true
        range = 28
        color = rgba(00e0ff33)
    }
}
