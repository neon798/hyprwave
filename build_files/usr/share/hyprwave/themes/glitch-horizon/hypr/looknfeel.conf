# Glitch Horizon — sharp digital corruption
# near-black base, acid lime primary, magenta secondary, cyan glitch
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 3
    layout = dwindle
    # hard glitch edge: lime → magenta
    col.active_border = rgba(a3ff3dff) rgba(ff3d9eff) 270deg
    col.inactive_border = rgba(1a1520cc)
}
decoration {
    rounding = 0
    active_opacity = 0.98
    blur {
        enabled = true
        size = 2
        passes = 1
    }
    shadow {
        enabled = true
        range = 8
        color = rgba(a3ff3d44)
    }
}
