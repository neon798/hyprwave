# Hyprwave window rules
#
# Hyprland 0.55+ (ashbuk/Hyprland-Fedora) replaced the old
# `windowrule = float, class:^(foo)$` one-liners with a special-category block:
#   windowrule {
#       name  = <unique-id>      # required: the category key
#       match {
#           class = ^(foo)$
#       }
#       float = true             # one or more rule effects
#   }
# Note: the `match { }` braces must each sit on their own line.
# Reference: https://wiki.hypr.land/Configuring/Window-Rules/

# --- Layer rules (Wayland layers like walker, waybar) ------------------------
# Rationale: Walker is a layer-shell surface (namespace "walker"). Disable
# open/close animations so the launcher feels instant and never "slides in"
# over tiled windows. (Must stay — regression if removed.)
layerrule = no_anim on, match:namespace walker

# --- Float + center + size dialogs / tray apps -------------------------------
# Shared rationale: system control UIs should not tile into the main workspace;
# they are short-lived tools launched from Waybar clicks or keybinds.

# Pulse volume UI (classic class) — sized so sliders remain usable.
windowrule {
    name = float-pavucontrol
    match {
        class = ^(pavucontrol)$
    }
    float = true
    center = true
    size = 800 600
}

# Pulse volume UI (PipeWire / Flatpak-style reverse-DNS class).
windowrule {
    name = float-pavucontrol-pw
    match {
        class = ^(org.pulseaudio.pavucontrol)$
    }
    float = true
    center = true
    size = 800 600
}

# Bluetooth manager from Waybar — modal settings, not a workspace citizen.
windowrule {
    name = float-blueman
    match {
        class = ^(blueman-manager)$
    }
    float = true
    center = true
}

# Some distro builds wrap blueman under a dotted class name.
windowrule {
    name = float-blueman-wrapped
    match {
        class = ^(\.blueman-manager-wrapped)$
    }
    float = true
}

# NetworkManager connection editor (Waybar network module click).
windowrule {
    name = float-nm-editor
    match {
        class = ^(nm-connection-editor)$
    }
    float = true
    center = true
}

# Polkit auth prompts must stay above tiles and be interactable immediately
# (package installs, theme SDDM pkexec, etc.).
windowrule {
    name = float-polkit-kde
    match {
        class = ^(org.kde.polkit-kde-authentication-agent-1)$
    }
    float = true
}

# Alternate polkit class string used by some package builds.
windowrule {
    name = float-polkit-kde-short
    match {
        class = ^(polkit-kde-authentication-agent-1)$
    }
    float = true
}

# Theme GUI (Super+Shift+T) — small modal, not a tiled app window.
# app id from hyprwave-theme-gui: Adw.Application(application_id=...)
# Preserve float+center — regression target from E-W1-001.
windowrule {
    name = float-hyprwave-theme-gui
    match {
        class = ^(dev\.hyprwave\.ThemeSwitcher)$
    }
    float = true
    center = true
}

# --- Portal file-chooser / open-save dialogs ---------------------------------
# Rationale: xdg-desktop-portal open/save surfaces should float and center so
# they are not buried in the dwindle tree during Super+S-adjacent workflows.

# Generic "Open File" title from portal / GTK choosers.
windowrule {
    name = float-open-file
    match {
        title = ^(Open File)(.*)$
    }
    float = true
    center = true
}

# Generic "Save File" title.
windowrule {
    name = float-save-file
    match {
        title = ^(Save File)(.*)$
    }
    float = true
    center = true
}

# "Save As" variants (some portals use this title).
windowrule {
    name = float-save-as
    match {
        title = ^(Save As)(.*)$
    }
    float = true
}

# Multi-select "Choose Files" chooser title.
windowrule {
    name = float-choose-files
    match {
        title = ^(Choose Files)(.*)$
    }
    float = true
}

# --- Synthwave translucency on terminals -------------------------------------
# Ghostty class is the reverse-DNS app id from its desktop file / GTK.
# Slight opacity matches the rest of the synthwave chrome without hurting read.
windowrule {
    name = ghostty-opacity
    match {
        class = ^(com.mitchellh.ghostty)$
    }
    opacity = 0.92 0.85
}

# --- Suppress maximize events ------------------------------------------------
# Some XWayland apps spam maximize requests; ignore so they stay under Hyprland
# control (tiling layout) instead of fighting for a fake maximized state.
windowrule {
    name = suppress-maximize
    match {
        class = .*
    }
    suppress_event = maximize
}
