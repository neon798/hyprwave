# Hyprwave keybindings
#
# $mainMod = SUPER (Windows / Command key)
# Full map: planning/integration/e-hyprland/KEYBIND-MAP.md
# Layout is dwindle via theme looknfeel (`general.layout = dwindle`) — not master.
# Do not use master-only layoutmsg (e.g. setleftwideratio); use togglesplit /
# splitratio below. Default theme gaps/border live in the theme pack only —
# this file does not set gaps (no layout redesign from binds).
# Post-merge smoke gate: planning/integration/e-hyprland/SESSION-SMOKE.md
# No wofi / swaybg / cliphist — Walker + hyprpaper + wl-clipboard only.

$mainMod = SUPER

# --- Apps --------------------------------------------------------------------
# Terminal: Ghostty (default). Super+Return and Super+T both open a terminal
# so muscle memory from either Omarchy-style or classic tiling setups works.
bind = $mainMod, Return, exec, ghostty
bind = $mainMod, T, exec, ghostty
bind = $mainMod, E, exec, ghostty -e yazi
bind = $mainMod, B, exec, neonwolf
bind = $mainMod, A, exec, ghostty -e flatarcade

# --- Launcher (Walker + elephant) --------------------------------------------
bind = $mainMod, D, exec, walker
bind = $mainMod, Space, exec, walker
bind = $mainMod, R, exec, walker --prefix ">"
bind = , XF86Search, exec, walker

# --- Theme -------------------------------------------------------------------
# GUI picker (same binary on Hyprland and COSMIC); floats via windowrules.conf
bind = $mainMod SHIFT, T, exec, hyprwave-theme-gui

# --- Assistant (ships in image; Super+A remains FlatArcade) ------------------
# Dedicated Ghostty --class so windowrules can float only the assistant TUI,
# not every terminal (title alone is unreliable with shell title sequences).
bind = $mainMod SHIFT, A, exec, ghostty --class=dev.hyprwave.Assistant --title="Hyprwave Assistant" -e hyprwave-assistant

# --- Window management -------------------------------------------------------
bind = $mainMod, Q, killactive
# Exit session: Shift required so Super+M alone cannot end the session by fat-finger
bind = $mainMod SHIFT, E, exit
bind = $mainMod, W, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod, V, togglegroup
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b

# --- Focus (arrows + vim) ----------------------------------------------------
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# --- Move window -------------------------------------------------------------
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# --- Workspaces --------------------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- Dwindle split / resize --------------------------------------------------
# Requires general.layout = dwindle in looknfeel (theme). These layoutmsg /
# splitratio dispatchers are the dwindle-safe set; master layout would ignore
# or mis-handle them (do not bind master setleftwideratio here).
bind = $mainMod, equal, layoutmsg, togglesplit
bind = $mainMod, minus, splitratio, -0.05
# "+" is Shift+= on most US layouts
bind = $mainMod SHIFT, equal, splitratio, +0.05

bind = $mainMod ALT, left, resizeactive, -40 0
bind = $mainMod ALT, right, resizeactive, 40 0
bind = $mainMod ALT, up, resizeactive, 0 -40
bind = $mainMod ALT, down, resizeactive, 0 40
bind = $mainMod ALT, h, resizeactive, -40 0
bind = $mainMod ALT, l, resizeactive, 40 0
bind = $mainMod ALT, k, resizeactive, 0 -40
bind = $mainMod ALT, j, resizeactive, 0 40

# --- Monitors ----------------------------------------------------------------
bind = $mainMod, period, focusmonitor, +
bind = $mainMod, comma, focusmonitor, -

# --- Lock / color picker -----------------------------------------------------
# Prefer loginctl so hypridle’s lock_cmd (pidof hyprlock || hyprlock) owns the
# instance — same path as idle timeout and before_sleep.
bind = $mainMod SHIFT, L, exec, loginctl lock-session
bind = $mainMod SHIFT, P, exec, hyprpicker -a

# --- Screenshots (hyprshot wraps grim/slurp; dir created in autostart.conf) --
bind = $mainMod, S, exec, hyprshot -m region --clipboard-only
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o ~/Pictures
bind = $mainMod CTRL, S, exec, hyprshot -m output --clipboard-only
bind = $mainMod CTRL SHIFT, S, exec, hyprshot -m output -o ~/Pictures

# --- Media / hardware keys ---------------------------------------------------
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
binde = , XF86AudioNext, exec, playerctl next
binde = , XF86AudioPrev, exec, playerctl previous
binde = , XF86AudioPlay, exec, playerctl play-pause

# --- Mouse -------------------------------------------------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
