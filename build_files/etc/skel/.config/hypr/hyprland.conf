# Hyprwave Hyprland entrypoint — fragments only; edit those files, not this one.
# Source order: settings first, then session bootstrap, then UI autostart.

source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/windowrules.conf

# --- Session bootstrap (must run before portals / UI daemons) -----------------
# Export compositor env into systemd --user so xdg-desktop-portal-hyprland,
# polkit, and any user units see WAYLAND_DISPLAY on first login.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP
exec-once = /usr/libexec/polkit-kde-authentication-agent-1

# UI daemons, wallpaper, launcher stack (ordered — see autostart.conf)
source = ~/.config/hypr/autostart.conf
