# Hyprwave lock screen (hyprlock)
#
# How hyprlock is started (single path — do not bind hyprlock directly):
#   Super+SHIFT+L  (bindings.conf) → loginctl lock-session
#   idle @ 600s    (hypridle.conf) → loginctl lock-session
#   before_sleep   (hypridle.conf) → loginctl lock-session
# hypridle general.lock_cmd then runs:  pidof hyprlock || hyprlock
# so a second Super+SHIFT+L does not stack lock instances.
#
# Wallpaper path is the *system brand* image under /usr/share/hyprwave/wallpapers/
# (not the active theme pack). Theme switch does not rewrite this file — lock
# stays a stable Hyprwave chrome. Fallback `color` shows if the PNG is missing.
# Fonts: JetBrains Mono (image package set).

background {
    monitor =
    path = /usr/share/hyprwave/wallpapers/default.png
    blur_passes = 3
    blur_size = 10
    brightness = 0.6
    contrast = 0.9
    color = rgba(11, 1, 33, 1.0)
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgb(ff2d95)
    inner_color = rgb(11, 1, 33)
    font_color = rgb(e0e0ff)
    fade_on_empty = true
    placeholder_text = <i>access granted...</i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = H Y P R W A V E
    color = rgb(00f0ff)
    font_size = 56
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(ff2d95)
    font_size = 28
    font_family = JetBrains Mono
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = ▂ ▄ ▅ ▇ █ ▇ ▅ ▄ ▂
    color = rgb(b967ff)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -45
    halign = center
    valign = center
}
