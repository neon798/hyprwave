# Managed by hyprwave-theme — regenerated on theme switch.
# Hyprwave wallpaper (hyprpaper) — NOT swaybg.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
#
# Multi-monitor behavior:
#   wallpaper = , /path/to/img
#     Empty monitor field = apply this image to *every* connected output.
#     This is the shipped default (works for 1..N monitors without edits).
#   wallpaper = DP-1, /path/a.jpg
#   wallpaper = HDMI-A-1, /path/b.jpg
#     Per-output wallpapers: name must match `hyprctl monitors` (e.g. eDP-1).
#   preload = /path
#     Load once into memory before wallpaper= lines reference it (can preload
#     several files if using different art per monitor).
#
# Hotplug: new outputs usually pick up the catch-all `,` wallpaper after
# hyprpaper is running with ipc = on. If a new monitor stays blank:
#   pkill -x hyprpaper; hyprctl dispatch exec hyprpaper
# Theme switch rewrites this file and restarts hyprpaper (hyprwave-theme).
#
# ipc = on keeps the daemon ready for future tooling; the current switcher
# restarts the process because hyprctl hyprpaper IPC is unreliable with our
# source-built hyprpaper (see AUTOSTART.md / THEME-SYMLINKS.md).

preload = /usr/share/hyprwave/wallpapers/default.png
wallpaper = , /usr/share/hyprwave/wallpapers/default.png
splash = false
ipc = on
