# Hyprwave monitor configuration
# Reference: https://wiki.hyprland.org/Configuring/Monitors/
#
# Syntax: monitor = NAME, RESOLUTION@HZ, POSITION, SCALE
# Discover names + modes:  hyprctl monitors all
#
# DEFAULT (shipped): every connected output at its preferred mode, auto-placed,
# scale 1. Do **not** replace this with a silent hardcode of one machine’s
# layout (eDP-1@1.5, fixed DP-1 coords, etc.) — that breaks VMs, other laptops,
# and multi-seat images. Users edit this file (or use a GUI) for their hardware.

monitor = , preferred, auto, 1

# --- HiDPI / scaling notes ---------------------------------------------------
#
# - Integer scale (1, 2) is the most reliable for XWayland apps.
# - Fractional scale (1.25, 1.5, 1.75) works on pure Wayland clients; some
#   XWayland apps may look soft or wrong-sized — prefer 2x + app zoom when unsure.
# - Per-monitor scale is allowed: laptop 1.5, external 1.
# - After edits: hyprctl reload  (or re-login if a monitor was hotplugged oddly).
#
# --- Examples (uncomment + edit to taste) ------------------------------------
#
# Single 1440p @ 144Hz, no scaling:
# monitor = DP-1, 2560x1440@144, 0x0, 1
#
# HiDPI laptop panel at 1.5x scale:
# monitor = eDP-1, 2880x1800@90, 0x0, 1.5
#
# Dual monitors side by side (left then right of it):
# monitor = DP-1, 2560x1440@144, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1
#
# Mixed scale (HiDPI laptop + 1080p external to the right):
# monitor = eDP-1, preferred, 0x0, 1.5
# monitor = HDMI-A-1, preferred, auto, 1
#
# Mirror HDMI onto the laptop panel:
# monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1
#
# Disable a monitor entirely:
# monitor = HDMI-A-1, disable
#
# Workspace → monitor sticky example (optional, advanced):
# workspace = 1, monitor:DP-1
# workspace = 2, monitor:HDMI-A-1
