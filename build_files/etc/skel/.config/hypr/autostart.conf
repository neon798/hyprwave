# Hyprwave first-session autostart
#
# Order is intentional. Hyprland runs exec-once lines in config order after the
# session bootstrap in hyprland.conf (dbus/import-environment + polkit).
# Full rationale: planning/integration/e-hyprland/AUTOSTART.md
#
# No swaybg / wofi / rofi — wallpaper is hyprpaper; launcher is Walker+elephant.

# Screenshot target for Super+S binds (hyprshot -o ~/Pictures)
exec-once = mkdir -p $HOME/Pictures

# Wallpaper early so the desktop is never blank while the bar comes up
exec-once = hyprpaper

# Notifications before apps that might notify on start
exec-once = mako

# Status bar
exec-once = waybar

# Idle → dim → lock → DPMS → suspend (see hypridle.conf timeout ladder)
exec-once = hypridle

# Portal after WAYLAND_DISPLAY is exported (hyprland.conf bootstrap)
exec-once = /usr/libexec/xdg-desktop-portal-hyprland

# Walker 2.x: elephant provides providers; Walker is a GApplication client.
# Elephant must be up before the first Super+D. Walker is also listed in
# ~/.config/autostart/walker.desktop (systemd-xdg-autostart-generator when the
# user session hits graphical-session.target). Hyprland raw sessions do not
# always run that generator, so we exec-once the service here as well.
# Second start is harmless — D-Bus name is a singleton.
exec-once = elephant
exec-once = walker --gapplication-service

# Network status lives in waybar (#network → nm-connection-editor). Skip nm-applet
# tray icon — it is a stock GTK glyph that never follows theme packs.
