# Hyprwave idle → lock → DPMS → suspend chain
#
# general.lock_cmd is what runs for:
#   - loginctl lock-session (keybind Super+SHIFT+L, before_sleep, this file’s lock listener)
#   - any other logind Lock signal hypridle receives
# Always use `pidof hyprlock || hyprlock` so a second lock does not stack instances.
#
# Timeout ladder (seconds after last input):
#   300  (5 min)  — dim backlight (no-op on VMs/desktops without a backlight)
#   600  (10 min) — lock session (must run *before* DPMS off)
#   630  (10.5)   — DPMS off (screen blank; unlock still via hyprlock)
#  1200  (20 min) — suspend (lid/AC policy still owned by logind)
#
# Do not put DPMS before lock: a blank unlocked desktop is a security gap and
# makes “is the session locked?” harder to verify during smoke tests.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10 || true
    on-resume = brightnessctl -r || true
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 630
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
    on-resume = hyprctl dispatch dpms on
}
