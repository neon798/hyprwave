# Hyprwave Walker config — clean synthwave launcher
#
# These keys are merged over Walker's built-in defaults, so only overrides live here.
# Full reference: https://github.com/abenz1267/walker/blob/master/resources/config.toml

force_keyboard_focus = true
selection_wrap = true
theme = "hyprwave"
hide_action_hints = true

[placeholders]
"default" = { input = " Search...", list = "No Results" }

[keybinds]
quick_activate = []

[columns]
symbols = 1

[providers]
max_results = 256
default = ["desktopapplications", "websearch"]
empty = ["desktopapplications"]

[[providers.prefixes]]
prefix = "/"
provider = "providerlist"

[[providers.prefixes]]
prefix = "."
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = "$"
provider = "clipboard"

[[emergencies]]
text = "Restart Walker"
command = "systemctl --user restart app-walker@autostart.service"
