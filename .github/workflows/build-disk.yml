---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso.toml'
      - './disk_config/iso-cosmic.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - de: hyprland
            disk-type: qcow2
            config: ./disk_config/disk.toml
          - de: hyprland
            disk-type: anaconda-iso
            config: ./disk_config/iso.toml
          - de: cosmic
            disk-type: anaconda-iso
            config: ./disk_config/iso-cosmic.toml
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          # Suffix for cosmic variant (hyprland stays bare name).
          if [[ "${{ matrix.de }}" == "cosmic" ]]; then
            echo "IMAGE_NAME=${IMAGE_NAME,,}-cosmic" >> ${GITHUB_ENV}
          fi
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Surgical pin hygiene (mirrors build.yml pin_guards; disk builds pull GHCR
      # images that must have been built without /releases/latest drift).
      - name: Pin guard — forbid floating GitHub release redirects
        run: |
          set -euo pipefail
          token="$(printf '%s/%s' releases latest)"
          bad=0
          if grep -nF "${token}" build_files/build.sh; then
            echo "::error::build_files/build.sh must not use floating GitHub release redirects"
            bad=1
          fi
          if grep -nF "${token}" build_files/versions.env; then
            echo "::error::build_files/versions.env must not use floating GitHub release redirects"
            bad=1
          fi
          if [[ "${bad}" -ne 0 ]]; then
            exit 1
          fi
          echo "OK: no floating-release token in build.sh or versions.env"

      - name: Pin guard — versions.env keys + bash -n
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . build_files/versions.env
          required=(
            YAZI_VERSION YAZI_URL YAZI_SHA256
            NEONWOLF_VERSION NEONWOLF_URL NEONWOLF_SHA256
            FLATARCADE_VERSION FLATARCADE_URL FLATARCADE_SHA256
            FLATARCADE_SVG_URL FLATARCADE_SVG_SHA256
          )
          for v in "${required[@]}"; do
            if [[ -z "${!v:-}" ]]; then
              echo "::error::versions.env missing or empty: ${v}"
              exit 1
            fi
          done
          bash -n build_files/build.sh
          if [[ -f planning/integration/a-stabilize/scripts/verify-pins.sh ]]; then
            bash -n planning/integration/a-stabilize/scripts/verify-pins.sh
          fi
          echo "OK: versions.env keys present; bash -n clean"

      # Network pin HEAD check (mirrors build.yml pin_guards). Disk jobs pull
      # GHCR images built from this tree; fail before BIB if pins already 404.
      # Light checksum intentionally omitted here — container pin_guards owns digests.
      - name: Pin guard — verify-pins HEAD
        run: |
          set -euo pipefail
          bash planning/integration/a-stabilize/scripts/verify-pins.sh --head

      - name: Pin guard — cosmic ISO matrix entry present
        run: |
          set -euo pipefail
          if ! grep -n 'iso-cosmic.toml' .github/workflows/build-disk.yml; then
            echo "::error::build-disk.yml must keep cosmic ISO matrix (iso-cosmic.toml)"
            exit 1
          fi
          if ! grep -nE 'de:[[:space:]]*cosmic' .github/workflows/build-disk.yml; then
            echo "::error::build-disk.yml must keep a matrix.de cosmic leg"
            exit 1
          fi
          echo "OK: disk workflow dual-image (cosmic) matrix present"

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.config }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
