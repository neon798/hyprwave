[package]
name = "hyprwave-tui"
version = "0.1.0"
edition = "2021"
description = "Hyprwave TUI Universal Updater & Installer"
license = "MIT"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
