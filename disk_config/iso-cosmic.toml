# Hyprwave COSMIC installable ISO — bootc-image-builder config
#
# =============================================================================
# OPERATOR NOTES — keep in sync with CI / Justfile / GHCR
# (F-W1-003 base · F-W3-001 refresh)
# =============================================================================
#
# Quick start (host)
#   1. Build the COSMIC container first (not the Hyprland image):
#        just build-cosmic
#      → localhost/hyprwave-cosmic:latest
#   2. Build this ISO (rootful Podman + KVM):
#        just build-iso-cosmic
#      Justfile recipe uses THIS file:
#        bootc-image-builder --type iso … -f disk_config/iso-cosmic.toml
#      Target container: localhost/hyprwave-cosmic (see Justfile build-iso-cosmic)
#   3. Optional host package smoke before ISO / VM:
#        bash planning/integration/f-cosmic/check-vendor-paths.sh   # exit 0
#        # then: planning/integration/f-cosmic/IMAGE-INSPECT.md
#
# Display manager (COSMIC only)
#   After install/boot: display-manager.service → cosmic-greeter.service
#   Do NOT expect or configure SDDM on this variant.
#   SDDM/hyprwave theme ships for Hyprland (disk_config/iso.toml) only.
#   See planning/integration/f-cosmic/GREETER.md
#
# Image names
#   Build arg:     DE=cosmic
#   Image name:    hyprwave-cosmic   (CI matrix / Just `build-cosmic`)
#   Local tag:     localhost/hyprwave-cosmic:<tag>   (default tag often `latest`)
#   Registry ref:  ghcr.io/neon798/hyprwave-cosmic:latest
#   GHCR access:   do NOT assume the package is public — CI/human may need
#                  credentials or a private pull; local ISO builds use the
#                  localhost tag; kickstart still points at the registry ref.
#
# Expected bootc ref after install (kickstart %post below)
#   transport: registry
#   image:     ghcr.io/neon798/hyprwave-cosmic:latest
#   Do NOT use ghcr.io/neon798/hyprwave:latest here — that is the Hyprland ISO
#   (disk_config/iso.toml). A wrong ref yields a Hyprland session on a “cosmic” ISO.
#
# How to build (detail)
#   just build-iso-cosmic
#   # Internally: bootc-image-builder --type iso -f disk_config/iso-cosmic.toml
#   # Target image: localhost/hyprwave-cosmic (see Justfile build-iso-cosmic)
#   Prerequisites: rootful Podman, KVM, pre-built hyprwave-cosmic container.
#
# Installer (Anaconda) modules
#   Enabled: Storage, Runtime, Network, Security, Services, Users, Timezone
#   Disabled: Subscription (not a RHEL subscription flow)
#
# Known installer / first-boot limits
#   1. Kickstart only switches the bootc image; it does not pre-create users beyond
#      what Anaconda Users module / disk customizations provide.
#   2. No autologin — cosmic-greeter remains the day-1 login gate (see GREETER.md).
#   3. Greeter wallpaper/theme is not Hyprwave-branded (session is). Do not treat
#      stock greeter chrome as a failed install.
#   4. Network during install depends on Anaconda Network module; post-install
#      NetworkManager is the guest default (smoke network items in SESSION-SMOKE).
#   5. ISO size/time track the full cosmic container (comps group + shared apps);
#      declutter removes only store/edit/player/wallpapers packages (DECLUTTER.md).
#   6. After first boot, verify: display-manager → cosmic-greeter, rpm -q declines
#      for cosmic-store, FlatArcade + hyprwave-theme present, and
#      /usr/share/backgrounds/hyprwave/default.png exists. No SDDM unit required.
#   7. Mutate-in-place switch requires registry pull access to ghcr.io on first
#      bootc switch; offline airgap needs a mirrored ref (out of scope for this file).
#      Do not document GHCR as public unless the human confirms package visibility.
#
# Sibling configs
#   disk_config/iso.toml   → Hyprland variant (hyprwave:latest) — SDDM path
#   disk_config/disk.toml  → shared qcow2/raw customizations (user, filesystem)
#
# Integration docs
#   planning/integration/f-cosmic/IMAGE-INSPECT.md   (host podman card)
#   planning/integration/f-cosmic/SESSION-SMOKE.md
#   planning/integration/f-cosmic/DECLUTTER.md
#   planning/integration/f-cosmic/GREETER.md
# =============================================================================

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/neon798/hyprwave-cosmic:latest
%end
"""

# Anaconda module set: storage/runtime/network/security/services/users/timezone.
# Subscription module disabled (not a RHEL subscription flow).
[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
